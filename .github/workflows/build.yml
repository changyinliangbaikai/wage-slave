name: Build & Release

on:
  # 推送 tag（如 v1.0.0）时自动触发正式发布
  push:
    tags:
      - 'v*'

  # 手动触发（用于测试构建，不发布 Release）
  workflow_dispatch:
    inputs:
      draft:
        description: '是否创建草稿 Release（否则只上传 Artifact）'
        type: boolean
        default: false

env:
  # 让 GitHub Actions 内部使用 Node.js 24 运行 action 脚本，消除 deprecation 警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows 构建 ───────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    # 使用 windows-2022 而非 windows-latest，避免 node-gyp 无法识别 VS 2026（版本 18）
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 配置 Python 3.11（Python 3.12+ 移除了 distutils，node-gyp 需要它）
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 配置 Windows 构建工具
      - name: 配置 Windows 构建工具
        uses: microsoft/setup-msbuild@v2

      # 安装依赖（包括 native 模块的 Windows 编译）
      - name: 安装依赖
        shell: bash
        run: |
          npm install

      # 重新编译 uiohook-napi native binding（针对当前 Electron 版本）
      - name: 重编译 uiohook-napi
        shell: bash
        run: |
          echo "正在重新编译 uiohook-napi..."
          npx @electron/rebuild -f -w uiohook-napi --verbose
          echo "uiohook-napi 编译完成"

      # 构建（编译 TypeScript + Vite 打包前端）
      - name: 构建项目
        shell: bash
        run: |
          echo "开始构建项目..."
          npm run build
          echo "项目构建完成"

      # 打包为 Windows 安装包
      # 如需代码签名，在此步骤前配置证书（见下方注释）
      - name: 打包 Windows 安装包
        shell: bash
        run: |
          echo "开始打包 Windows 安装包..."
          echo "当前工作目录："
          pwd
          echo "项目结构："
          ls -la
          echo "dist-electron 目录："
          ls -la dist-electron/ || echo "dist-electron 目录不存在"
          echo "dist 目录："
          ls -la dist/ || echo "dist 目录不存在"
          npm run dist
          echo "Windows 安装包打包完成"
          echo "release 目录内容："
          ls -la release/ || echo "release 目录不存在"
          # 注意：不在这里设置 GH_TOKEN，防止 electron-builder 自动发布到 GitHub
          # release job 会负责创建 GitHub Release

      # 如果构建失败，收集调试信息
      - name: 收集调试信息
        if: failure()
        shell: bash
        run: |
          echo "构建失败，收集调试信息..."
          echo "Node.js 版本："
          node --version
          echo "npm 版本："
          npm --version
          echo "Python 版本："
          python --version
          echo "当前工作目录："
          pwd
          echo "项目文件："
          ls -la
          echo "npm 错误日志："
          cat npm-debug.log || echo "没有 npm 错误日志"
          echo "Electron 构建日志："
          find . -name "*.log" -exec echo "=== {} ===" \; -exec cat {} \;

      # 上传安装包为 Artifact（每次构建都可下载，无论是否发布 Release）
      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao-niu-ma-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.msi
            release/**/*.exe
            release/**/*.msi
          retention-days: 30
        continue-on-error: true

  # ── macOS 构建 ────────────────────────────────────────
  # 当前仅构建 Apple Silicon (arm64) 版本
  # 如需同时支持 Intel Mac (x64)，可改用 matrix 策略：
  #   strategy:
  #     matrix:
  #       include:
  #         - { arch: x64,   runner: macos-13 }   # Intel Mac runner
  #         - { arch: arm64, runner: macos-14 }   # Apple Silicon runner
  #   runs-on: ${{ matrix.runner }}
  build-mac:
    name: Build macOS Installer
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 配置 Python 3.11（node-gyp 编译 native 模块需要）
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装依赖（包括 native 模块的 macOS 编译）
      - name: 安装依赖
        shell: bash
        run: |
          npm install

      # 重新编译 uiohook-napi native binding（针对当前 Electron 版本 + arm64 架构）
      - name: 重编译 uiohook-napi
        shell: bash
        run: |
          echo "正在重新编译 uiohook-napi (arm64)..."
          npx @electron/rebuild -f -w uiohook-napi --arch=arm64 --verbose
          echo "uiohook-napi 编译完成"

      # 构建（编译 TypeScript + Vite 打包前端）
      - name: 构建项目
        shell: bash
        run: |
          echo "开始构建项目..."
          npm run build
          echo "项目构建完成"

      # 打包为 macOS dmg 安装包
      # 通过环境变量禁用代码签名自动发现（个人项目无 Apple Developer 证书）
      - name: 打包 macOS 安装包
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          echo "开始打包 macOS 安装包..."
          echo "当前工作目录："
          pwd
          echo "项目结构："
          ls -la
          echo "dist-electron 目录："
          ls -la dist-electron/ || echo "dist-electron 目录不存在"
          echo "dist 目录："
          ls -la dist/ || echo "dist 目录不存在"
          # 不使用 npm run dist，避免 electron-builder 默认行为；显式指定 mac + arm64
          npx electron-builder --mac --arm64 --publish=never
          echo "macOS 安装包打包完成"
          echo "release 目录内容："
          ls -la release/ || echo "release 目录不存在"

      # 如果构建失败，收集调试信息
      - name: 收集调试信息
        if: failure()
        shell: bash
        run: |
          echo "构建失败，收集调试信息..."
          echo "Node.js 版本："
          node --version
          echo "npm 版本："
          npm --version
          echo "Python 版本："
          python --version
          echo "macOS 版本："
          sw_vers || true
          echo "当前工作目录："
          pwd
          echo "项目文件："
          ls -la
          echo "Electron 构建日志："
          find . -name "*.log" -exec echo "=== {} ===" \; -exec cat {} \;

      # 上传安装包为 Artifact
      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao-niu-ma-mac-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/**/*.dmg
            release/**/*.zip
          retention-days: 30
        continue-on-error: true

  # ── 发布 Release（仅 tag 推送时执行）──────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: xiao-niu-ma-*
          merge-multiple: true
          path: ./release-files

      - name: 检查下载的文件
        shell: bash
        run: |
          echo "下载的构建产物："
          ls -la ./release-files/
          echo "--- Windows 产物 ---"
          find ./release-files/ -type f \( -name "*.exe" -o -name "*.msi" \) || echo "未找到 Windows 产物"
          echo "--- macOS 产物 ---"
          find ./release-files/ -type f \( -name "*.dmg" -o -name "*.zip" \) || echo "未找到 macOS 产物"

      - name: 读取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 读取 CHANGELOG
        id: changelog
        run: |
          echo "版本号: ${{ steps.version.outputs.VERSION }}"
          if [ -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md 文件存在"
            VERSION="${{ steps.version.outputs.VERSION }}"
            # 使用 sed 提取从版本号行到下一个 ## 开头的行之间的内容
            CONTENT=$(sed -n "/## \[$VERSION\]/,/^## /p" CHANGELOG.md | head -n -1 | tail -n +2)
            echo "提取的内容:"
            echo "$CONTENT"
            # 使用正确的格式写入 GITHUB_OUTPUT
            {
              echo "CHANGELOG_CONTENT<<EOF"
              echo "$CONTENT"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG_CONTENT=暂无更新日志" >> $GITHUB_OUTPUT
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 小小牛马 v${{ steps.version.outputs.VERSION }}
          draft: false  # tag 推送时自动发布，不创建草稿
          prerelease: false
          files: ./release-files/*
          body: |
            ## 小小牛马 v${{ steps.version.outputs.VERSION }}

            ### Windows 安装说明
            1. 下载 `小小牛马-Setup-${{ steps.version.outputs.VERSION }}.exe`
            2. 双击安装（如弹出 Windows 安全提示，点击"更多信息"→"仍要运行"）
            3. 安装完成后在系统托盘找到橘猫图标
            4. 右键托盘图标 → 设置，填写 LLM API 信息

            ### macOS 安装说明（仅支持 Apple Silicon / M 系列芯片）
            1. 下载 `xiao-niu-ma-${{ steps.version.outputs.VERSION }}-arm64.dmg`
            2. 双击打开 dmg，将「小小牛马」拖入「应用程序」
            3. 首次运行如提示「无法验证开发者」或「已损坏」：
               - 方式 A：右键应用 → 打开 → 在弹窗中点「打开」
               - 方式 B：终端执行 `xattr -cr /Applications/小小牛马.app` 后再启动
            4. 「休息提醒」需要在「系统设置 → 隐私与安全性 → 辅助功能」中允许小小牛马

            ### 数据存储位置
            - Windows：`%APPDATA%\xiao-niu-ma\`
            - macOS：`~/Library/Application Support/xiao-niu-ma/`

            ### 注意事项
            - 首次运行需在设置中配置 LLM API Key
            - Windows：如休息提醒不生效，请在 Windows 安全中心将应用加入白名单
            - macOS：当前仅提供 Apple Silicon (arm64) 版本，Intel Mac 用户请从源码自行构建

            ---
            ### 更新内容
            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
