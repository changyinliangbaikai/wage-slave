name: Build & Release

on:
  # 推送 tag（如 v1.0.0）时自动触发正式发布
  push:
    tags:
      - 'v*'

  # 手动触发（用于测试构建，不发布 Release）
  workflow_dispatch:
    inputs:
      draft:
        description: '是否创建草稿 Release（否则只上传 Artifact）'
        type: boolean
        default: false

env:
  # 让 GitHub Actions 内部使用 Node.js 24 运行 action 脚本，消除 deprecation 警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows 构建 ───────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 配置 Python 3.11（Python 3.12+ 移除了 distutils，node-gyp 需要它）
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 配置 Windows 构建工具
      - name: 配置 Windows 构建工具
        uses: microsoft/setup-msbuild@v2

      # 安装依赖（包括 native 模块的 Windows 编译）
      - name: 安装依赖
        shell: bash
        run: |
          npm install

      # 重新编译 uiohook-napi native binding（针对当前 Electron 版本）
      - name: 重编译 uiohook-napi
        shell: bash
        run: |
          echo "正在重新编译 uiohook-napi..."
          npx @electron/rebuild -f -w uiohook-napi --verbose
          echo "uiohook-napi 编译完成"

      # 构建（编译 TypeScript + Vite 打包前端）
      - name: 构建项目
        shell: bash
        run: |
          echo "开始构建项目..."
          npm run build
          echo "项目构建完成"

      # 打包为 Windows 安装包
      # 如需代码签名，在此步骤前配置证书（见下方注释）
      - name: 打包 Windows 安装包
        shell: bash
        run: |
          echo "开始打包 Windows 安装包..."
          echo "当前工作目录："
          pwd
          echo "项目结构："
          ls -la
          echo "dist-electron 目录："
          ls -la dist-electron/ || echo "dist-electron 目录不存在"
          echo "dist 目录："
          ls -la dist/ || echo "dist 目录不存在"
          npm run dist
          echo "Windows 安装包打包完成"
          echo "release 目录内容："
          ls -la release/ || echo "release 目录不存在"
          # 注意：不在这里设置 GH_TOKEN，防止 electron-builder 自动发布到 GitHub
          # release job 会负责创建 GitHub Release

      # 如果构建失败，收集调试信息
      - name: 收集调试信息
        if: failure()
        shell: bash
        run: |
          echo "构建失败，收集调试信息..."
          echo "Node.js 版本："
          node --version
          echo "npm 版本："
          npm --version
          echo "Python 版本："
          python --version
          echo "当前工作目录："
          pwd
          echo "项目文件："
          ls -la
          echo "npm 错误日志："
          cat npm-debug.log || echo "没有 npm 错误日志"
          echo "Electron 构建日志："
          find . -name "*.log" -exec echo "=== {} ===" \; -exec cat {} \;

      # 上传安装包为 Artifact（每次构建都可下载，无论是否发布 Release）
      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao-niu-ma-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.msi
            release/**/*.exe
            release/**/*.msi
          retention-days: 30
        continue-on-error: true

  # ── 发布 Release（仅 tag 推送时执行）──────────────────
  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: xiao-niu-ma-windows-*
          merge-multiple: true
          path: ./release-files

      - name: 检查下载的文件
        shell: bash
        run: |
          echo "下载的构建产物："
          ls -la ./release-files/
          find ./release-files/ -type f -name "*.exe" -o -name "*.msi"

      - name: 读取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 读取 CHANGELOG
        id: changelog
        run: |
          echo "版本号: ${{ steps.version.outputs.VERSION }}"
          if [ -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md 文件存在"
            echo "文件内容预览:"
            head -20 CHANGELOG.md
            echo "开始提取版本内容..."
            # 提取对应版本的更新内容
            VERSION="${{ steps.version.outputs.VERSION }}"
            # 使用 awk 提取从版本号到下一个版本号之间的内容
            CONTENT=$(awk -v ver="$VERSION" '/## \['ver'/ {found=1} found {print} /^## / && !/## \['ver'/ {if(found) exit}' CHANGELOG.md | tail -n +2)
            echo "提取的内容:"
            echo "$CONTENT"
            echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "提取完成"
          else
            echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
            echo "暂无更新日志" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 小小牛马 v${{ steps.version.outputs.VERSION }}
          draft: false  # tag 推送时自动发布，不创建草稿
          prerelease: false
          files: ./release-files/*
          body: |
            ## 小小牛马 v${{ steps.version.outputs.VERSION }}

            ### 安装说明
            1. 下载 `小小牛马-Setup-${{ steps.version.outputs.VERSION }}.exe`
            2. 双击安装（如弹出 Windows 安全提示，点击"更多信息"→"仍要运行"）
            3. 安装完成后在系统托盘找到橘猫图标
            4. 右键托盘图标 → 设置，填写 LLM API 信息

            ### 数据存储位置
            `%APPDATA%\xiao-niu-ma\`

            ### 注意事项
            - 首次运行需在设置中配置 LLM API Key
            - 如休息提醒不生效，请在 Windows 安全中心将应用加入白名单

            ---
            ### 更新内容
            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
